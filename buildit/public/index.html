<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build-It — Break It / Build It Workshop</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3147;
      --accent:    #5b8af0;
      --accent2:   #3ecf7a;
      --danger:    #e05c5c;
      --text:      #e2e4f0;
      --muted:     #7a7f99;
      --mono:      'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent2); }
    .subtitle { color: var(--muted); font-size: 13px; margin-left: auto; }

    /* ── Layout ────────────────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; padding: 0 8px; }

    .vuln-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1.4;
    }
    .vuln-btn:hover { background: rgba(91,138,240,0.08); border-color: var(--border); }
    .vuln-btn.active { background: rgba(91,138,240,0.15); border-color: var(--accent); }
    .vuln-btn .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      font-weight: 600;
    }
    .badge.vuln { background: rgba(224,92,92,0.2); color: var(--danger); }
    .badge.fixed { background: rgba(62,207,122,0.15); color: var(--accent2); }

    /* ── Detail panel ──────────────────────────────────────────────────── */
    section {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; }

    .vuln-title { font-size: 20px; font-weight: 700; }

    .explanation-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .explanation-box h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
    .explanation-box pre { font-family: inherit; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: var(--text); }

    .file-label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-label code {
      font-family: var(--mono);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--accent);
    }

    .editor-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .editor-wrap h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

    textarea#codeEditor {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      background: #0a0c14;
      color: #cdd6f4;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      min-height: 180px;
      resize: vertical;
      outline: none;
      tab-size: 2;
      transition: border-color 0.15s;
    }
    textarea#codeEditor:focus { border-color: var(--accent); }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btnApplyFix    { background: var(--accent2); color: #0a1a10; }
    #btnApplyFix:hover:not(:disabled) { opacity: 0.9; }

    #btnShowFix     { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
    #btnShowFix:hover:not(:disabled) { background: rgba(91,138,240,0.1); }

    #btnReset       { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); }
    #btnReset:hover:not(:disabled) { background: rgba(224,92,92,0.1); }

    /* ── Status bar ────────────────────────────────────────────────────── */
    #statusBar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid;
    }
    #statusBar.success { background: rgba(62,207,122,0.1); border-color: var(--accent2); color: var(--accent2); }
    #statusBar.error   { background: rgba(224,92,92,0.1);  border-color: var(--danger);  color: var(--danger); }
    #statusBar.info    { background: rgba(91,138,240,0.1); border-color: var(--accent);  color: var(--accent); }

    /* ── Spinner ───────────────────────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Build<span>-It</span></div>
  <div style="color:var(--muted);font-size:14px;">Break It / Build It · ISS × GDG on Campus Sheridan</div>
  <div class="subtitle">OWASP Juice Shop v20.1.1</div>
</header>

<main>
  <!-- ── Sidebar ── -->
  <aside>
    <h2>Vulnerabilities</h2>
    <div id="vulnList">
      <div style="color:var(--muted);font-size:13px;padding:8px;">Loading…</div>
    </div>
  </aside>

  <!-- ── Detail panel ── -->
  <section id="detail">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <div style="font-size:16px;font-weight:600;">Select a vulnerability</div>
      <div style="font-size:13px;">Choose one from the left panel to begin.</div>
    </div>
  </section>
</main>

<script>
  let currentVuln = null
  let vulns = []

  // ── Load sidebar list ──────────────────────────────────────────────────────
  async function loadVulnList () {
    const res = await fetch('/api/vulns')
    vulns = await res.json()
    const list = document.getElementById('vulnList')
    list.innerHTML = ''
    vulns.forEach(v => {
      const btn = document.createElement('button')
      btn.className = 'vuln-btn'
      btn.dataset.id = v.id
      btn.textContent = v.title
      btn.addEventListener('click', () => loadVuln(v.id))
      list.appendChild(btn)
    })
  }

  // ── Load single vulnerability detail ──────────────────────────────────────
  async function loadVuln (id) {
    // Mark active sidebar button
    document.querySelectorAll('.vuln-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id))

    const res = await fetch(`/api/vulns/${id}`)
    if (!res.ok) { showDetail(null); return }
    currentVuln = await res.json()
    showDetail(currentVuln)
  }

  // ── Render detail panel ────────────────────────────────────────────────────
  function showDetail (v) {
    const section = document.getElementById('detail')
    if (!v) {
      section.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>Failed to load vulnerability.</div></div>`
      return
    }

    const statusClass = v.isVulnerable ? 'vuln' : 'fixed'
    const statusText  = v.isVulnerable ? '⚠ Vulnerable' : '✓ Fixed'

    if (v.readOnly) {
      section.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div class="vuln-title">${escHtml(v.title)}</div>
          <span class="badge vuln">⚠ Vulnerable</span>
          <span class="badge" style="background:rgba(91,138,240,0.15);color:var(--accent);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;">Frontend — No Live Demo</span>
        </div>
        <div class="explanation-box">
          <h3>What's the vulnerability?</h3>
          <pre>${escHtml(v.explanation)}</pre>
        </div>
        <div style="background:rgba(91,138,240,0.07);border:1px solid var(--border);border-radius:8px;padding:16px 20px;color:var(--muted);font-size:13px;line-height:1.6;">
          ℹ️ This fix lives in the Angular frontend. Rebuilding takes several minutes,<br>
          so the code is shown above for explanation purposes — no live save for this one.
        </div>
      `
      return
    }

    section.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div class="vuln-title">${escHtml(v.title)}</div>
        <span class="badge ${statusClass}">${statusText}</span>
      </div>

      <div class="explanation-box">
        <h3>What's the vulnerability?</h3>
        <pre>${escHtml(v.explanation)}</pre>
      </div>

      <div class="file-label">
        Editing file: <code>${escHtml(v.file)}</code>
      </div>

      <div class="editor-wrap">
        <h3>Code Editor — edit this live, then click Save Fix</h3>
        <textarea id="codeEditor" spellcheck="false">${escHtml(v.currentCode)}</textarea>
      </div>

      <div class="actions">
        <button id="btnApplyFix"  onclick="applyFix()">💾 Save Fix</button>
        <button id="btnShowFix"   onclick="showFix()">🔧 Load Reference Fix</button>
        <button id="btnReset"     onclick="resetVuln()">↩ Reset to Vulnerable</button>
      </div>

      <div id="statusBar">
        <div class="spinner" id="spinner"></div>
        <span id="statusMsg"></span>
      </div>
    `
  }

  // ── Save whatever is in the editor ────────────────────────────────────────
  async function applyFix () {
    if (!currentVuln) return
    const code = document.getElementById('codeEditor').value
    setStatus('info', 'Saving…', true)
    disableButtons(true)
    try {
      const res = await fetch(`/api/vulns/${currentVuln.id}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      })
      const data = await res.json()
      if (res.ok) {
        setStatus('success', '✓ ' + data.message)
        await loadVuln(currentVuln.id) // refresh badge
      } else {
        setStatus('error', '✗ ' + (data.error || 'Unknown error'))
      }
    } catch (e) {
      setStatus('error', '✗ Network error: ' + e.message)
    } finally {
      disableButtons(false)
    }
  }

  // ── Load the reference fix into the editor ─────────────────────────────────
  function showFix () {
    if (!currentVuln) return
    document.getElementById('codeEditor').value = currentVuln.fixed
    setStatus('info', 'Reference fix loaded into editor. Review it, then click Save Fix.')
  }

  // ── Reset to vulnerable state ──────────────────────────────────────────────
  async function resetVuln () {
    if (!currentVuln) return
    if (!confirm('Reset this file to the vulnerable state? This is for demo purposes only.')) return
    setStatus('info', 'Resetting…', true)
    disableButtons(true)
    try {
      const res = await fetch(`/api/vulns/${currentVuln.id}/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      const data = await res.json()
      if (res.ok) {
        setStatus('success', '↩ ' + data.message)
        await loadVuln(currentVuln.id)
      } else {
        setStatus('error', '✗ ' + (data.error || 'Unknown error'))
      }
    } catch (e) {
      setStatus('error', '✗ Network error: ' + e.message)
    } finally {
      disableButtons(false)
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function setStatus (type, msg, spinning = false) {
    const bar = document.getElementById('statusBar')
    const spin = document.getElementById('spinner')
    const txt  = document.getElementById('statusMsg')
    if (!bar) return
    bar.className = type
    bar.style.display = 'flex'
    spin.style.display = spinning ? 'block' : 'none'
    txt.textContent = msg
  }

  function disableButtons (yes) {
    ['btnApplyFix','btnShowFix','btnReset'].forEach(id => {
      const el = document.getElementById(id)
      if (el) el.disabled = yes
    })
  }

  function escHtml (s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  // ── Handle Tab key in textarea ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.target.id === 'codeEditor' && e.key === 'Tab') {
      e.preventDefault()
      const ta = e.target
      const start = ta.selectionStart
      const end   = ta.selectionEnd
      ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end)
      ta.selectionStart = ta.selectionEnd = start + 2
    }
  })

  loadVulnList()
</script>
</body>
</html>
