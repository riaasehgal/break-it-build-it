# MultiJuicer Helm values for Break It / Build It, chart 10.4.0.
# Every key was checked against the 10.4.0 chart's values.yaml and templates on 2026-11-26.
#
# NOT in this file on purpose:
#   adminPassword, cookie.cookieParserSecret -> generated per project by deploy.sh into
#     hosting/generated/<project>/secret-values.yaml (gitignored). If cookieParserSecret were unset,
#     every helm upgrade would rotate it and log all participants out.
#   config.maxInstances, config.juiceShop.image/tag -> set by deploy.sh with --set
#     (maxInstances = instances + 1 because the balancer refuses at existing+1 >= max).

# Balancer: every participant request is proxied through it, so give it headroom and 2 replicas.
replicas: 2
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 512Mi

# Public exposure is manifests/lb-service.yaml (port 80 -> 8080). The chart's Service can only
# expose service.port with no separate targetPort, so it stays internal.
service:
  type: ClusterIP

cookie:
  secure: false   # plain HTTP (no TLS at the event); a secure cookie would never be sent back

config:
  maxInstances: 11          # overridden by deploy.sh
  teamPasscodeLength: 8     # min 8, multiple of 4; 8 is easiest to read off a screen
  juiceShop:
    image: bkimminich/juice-shop   # overridden by deploy.sh --juice-image
    tag: v20.1.1                   # matches buildit/ and juice-theme/ verification
    deleteInactiveAfter: 24h       # don't delete anyone's progress during talks
    # Measured: ~160-175 MiB idle, ready in 1.3 s at 1 CPU. Low requests pack ~65 per 8-vCPU node;
    # limits stop one participant's memory-bomb challenge from starving neighbours.
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: "1"
        memory: 768Mi
    config:
      application:
        # Local assets. The chart default points at raw.githubusercontent.com, which makes every pod
        # download at startup, and our NetworkPolicy blocks that egress.
        logo: JuiceShop_Logo.png
        favicon: favicon_js.ico
        showVersionNumber: false
        showGitHubLinks: false
      challenges:
        showHints: true
      hackingInstructor:
        isEnabled: true
      ctf:
        showFlagsInNotifications: false
        systemWideNotifications:
          url: /multi-juicer/api/notifications
          pollFrequencySeconds: 15
