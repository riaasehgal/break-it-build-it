# Hosted Build-It (sandbox mode): its own Deployment, public LoadBalancer and NetworkPolicy, separate
# from MultiJuicer. Applied only with deploy.sh --with-buildit; __BUILDIT_IMAGE__ is replaced by deploy.sh.
# One replica on purpose: practice copies live in this pod's memory, so every visitor must hit the same pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildit
  namespace: multi-juicer
  labels:
    app.kubernetes.io/name: buildit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: buildit
          image: __BUILDIT_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: BUILDIT_MODE
              value: sandbox
          readinessProbe:
            httpGet:
              path: /api/vulns
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/vulns
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: buildit-public
  namespace: multi-juicer
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: buildit
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3100
---
# Build-It needs no outbound connections at all (not even DNS): deny all egress, allow only its HTTP port in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildit-isolation
  namespace: multi-juicer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildit
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3100
  egress: []
